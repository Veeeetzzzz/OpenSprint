version: '3.8'

services:
  # OpenSprint Application
  opensprint:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_PROVIDER=sqlite
      - DATABASE_URL=file:./data/opensprint.db
      - JWT_SECRET=${JWT_SECRET:-please-change-this-in-production}
      - AUTH_MODE=${AUTH_MODE:-simple}
      - FEATURE_AUDIT_LOG=false
      - FEATURE_WEBHOOKS=false
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/data
      - uploads:/app/uploads
    networks:
      - opensprint-network

volumes:
  sqlite_data:
  uploads:

networks:
  opensprint-network:
    driver: bridge
